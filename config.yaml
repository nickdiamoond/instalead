# Daily pipeline tuning. Each subsection corresponds to a step in
# scripts/pipeline.py. Most keys fall back to DEFAULT_* constants in that
# script; ``pipeline.step1.posts_max_age_days`` and
# ``pipeline.step1.min_comments_per_post`` fall back via ``src.config``.
# Missing keys / sections keep the pipeline bootable on a fresh machine.
pipeline:
  # When true (default), Step 3 and Step 5 ask ``Proceed? (y/n)`` in the
  # terminal before Apify comment scraping / Sherlock; if the run ends with
  # issues, the script waits for Enter before exit. Set false for cron /
  # unattended runs (no terminal prompts; expensive steps always run).
  prompt_terminal_confirmation: false

  step1:
    # Where Step 1 discovers posts: "realtors" (instagram-post-scraper on
    # search.realtor_accounts), "hashtags" (instagram-hashtag-scraper on search.hashtags),
    # or "cookie_keywords" (crawlerbros/instagram-keyword-search-scraper on
    # search.cookie_search_keywords; requires INSTAGRAM_SESSION_COOKIE or env from
    # pipeline.step1.cookie_search.session_cookie_env_var). For hashtags and cookie_keywords,
    # posts_max_age_days is applied client-side after fetch (see src.ig_media_payload).
    discovery_mode: realtors
    # crawlerbros keyword-search actor (``apify.actors.cookie_search_posts``): maxPosts per
    # keyword, cookie env var name, session label. Only used when discovery_mode=cookie_keywords.
    cookie_search:
      size_per_keyword: 20
      session_cookie_env_var: "INSTAGRAM_SESSION_COOKIE"
      session_name: "instalead_cookie_search"
    # apify/instagram-post-scraper: resultsLimit per username (realtors mode).
    post_scraper_results_limit: 20
    # instagram-hashtag-scraper: resultsLimit per hashtag per resultsType (posts vs reels).
    # Defaults to post_scraper_results_limit above when omitted.
    hashtag_results_limit: 10
    # apify/instagram-post-scraper input "onlyPostsNewerThan = N days".
    # Realtors don't update old posts, so this both bounds the dataset
    # and keeps comments fresh enough for Step 3 to find new commenters.
    posts_max_age_days: 7
    # Filter for processed_posts: posts with fewer than this many
    # comments aren't worth scoring (DeepSeek $) or scanning (Apify $).
    min_comments_per_post: 10

  step3:
    # Re-scan a post's comments only after N% growth since last scan.
    # Lower = more freshness, higher = lower Apify cost.
    comments_growth_pct: 5.0
    # Used only for the "Estimated cost" prompt in Step 3 -- the actual
    # bill is read back from Apify's run.usageTotalUsd. Update if the
    # primary actor's pricing changes.
    cost_per_comment_usd: 0.0005
    # louisdeconinck silently returns 0 items unless we declare a
    # per-post comment cap (bisected via test_comment_scrapers.py).
    # 10000 is a paranoia ceiling, NOT a real cap (max observed ~2200).
    # Bumping it does not raise the bill -- the actor returns only
    # comments that actually exist on the post.
    louisdeconinck_comments_cap_per_post: 500
    # Step 3 fallback (apidojo-api): actor input maxItems is a run-wide
    # total, not per-post. Pipeline sends maxItems = cap * posts_in_batch.
    apidojo_comments_cap_per_post: 2000

  step4:
    # apify/instagram-profile-scraper batch size. Apify accepts up
    # to ~50 usernames per run before throughput drops; smaller =
    # more API overhead, bigger = more data lost if a batch fails.
    profile_batch_size: 50
    # Max leads pulled per pipeline run from get_leads_without_profile.
    # Bigger = more new contacts/run but a longer run; smaller =
    # backlog grows across runs.
    batch_limit: 500

  step5:
    # Max leads pulled per pipeline run from get_leads_for_sherlock.
    # Smaller than step4 because Sherlock runs nick (~30s) then photo
    # (~135s) per lead. 1000 leads on a 3-account pool is already a
    # multi-hour run; bigger pools could safely raise this.
    batch_limit: 500
    # Temporary throttle: one lead fully resolved before the next; pause
    # (seconds) between leads after the first. Set sequential: false to
    # restore parallel Step 5.
    sequential: true
    request_gap_secs: 5

db:
  path: "data/leads.db"

# Face detection (SCRFD via InsightFace).
#
# We run TWO FaceEmbedder instances with different det_size canvases —
# avatars and post photos have very different recall characteristics:
#
#   * avatar_det_size: Instagram avatars come back as 320x320 thumbnails.
#     Running them through 640 upscales 2x and pushes "face fills frame"
#     selfies past SCRFD's largest anchor (~256 px), where recall drops.
#     320 = native size, no upscale, faces stay in the anchor sweet
#     spot. Confirmed via test_avatar_sort.py: ~zero false negatives on
#     1000+ real avatars at this size.
#   * post_det_size: feed photos can be 1080x1080+ with multiple smaller
#     faces (group shots, distant subjects). 640 gives wider anchor
#     coverage for those.
#
# min_det_score is shared. 0.6 was tuned via test_avatar_sort.py's
# threshold sweep — strict enough to drop background faces / posters
# in the frame, loose enough to keep real profile / side-view
# detections (typical confidence on real faces: 0.78-0.92).
face_detection:
  min_det_score: 0.7
  avatar_det_size: 320
  post_det_size: 640
  # Step 4: if the avatar has exactly one face but its bbox covers less
  # than this fraction of the image area (percent), skip promoting the
  # avatar to face_photo_path and run the last-posts face-leader fallback
  # instead. Post-photo path is unchanged.
  min_avatar_face_area_pct: 1.5

# Face leader fallback: when avatar face count is not exactly 1, probe the
# last N post photos, keep only single-face ones, cluster them by cosine
# similarity, and promote the largest cluster (if it covers >= M photos)
# to the canonical face for the lead.
face_fallback:
  latest_posts_limit: 10       # N: how many of the most recent posts to probe
  min_cluster_size: 2         # M: leader cluster must cover at least this many photos
  cluster_threshold: 0.5      # cosine-similarity threshold for cluster_faces
  skip_videos: true           # ignore post items that are videoUrl-only
  keep_photos: false          # false = delete downloaded post photos after processing (keep only the chosen one)

# DeepSeek system prompts used by scripts/pipeline.py.
# ``usermatch_prompt`` must keep {username}, {full_name}, {candidates} placeholders.
deepseek:
  relevance_prompt: |
    Ты анализируешь описание поста/рилса из Instagram от риелтора. Определи:

    1. is_real_estate — пост про недвижимость (продажа/покупка квартир, обзоры ЖК, ипотека)?
    2. has_call_to_action — есть ли призыв заинтересованным покупателям писать в комментарии/директ?
    3. call_to_action_type — тип призыва: "comment" / "direct" / "link" / "none"

    Если описание слишком короткое или непонятное — верни is_real_estate: null.

    Ответь ТОЛЬКО валидным JSON без markdown:
    {"is_real_estate": true/false/null, "has_call_to_action": true/false, "call_to_action_type": "comment"|"direct"|"link"|"none"}
  usermatch_prompt: |
    # Задача
    Ты анализируешь Ник пользователя из Instagram (username) и его ФИО из профиля (если оно присутствует), а также пронумерованный список потенциальных кандидатов.
    Ты должен определить, кому из кандидатов принадлежит этот аккаунт, либо вернуть 0, если аккаунт не удалось уверенно сопоставить ни с одним кандидатом.

    Иногда ник содержит (частично) имя или фамилию кандидата. Если ФИО в профиле пустое или состоит из неинформативных слов (например, «блогер», «рилсмейкер»), приоритет отдаётся нику.
    Если ФИО присутствует и похоже на реальное имя, оно получает приоритет, но ник может использоваться для уточнения.

    # Алгоритм анализа
    Выполняй шаги строго по порядку.

    1. **Извлеки значимые части из ФИО пользователя.**
       - Удали из строки всё, что не является именем или фамилией (слова вроде «блогер», «рилсмейкер», «official», эмодзи и т.п.).
       - Оставшиеся слова считай набором значимых частей (порядок не фиксирован). Их может быть 0, 1, 2 или более.
       - Если значимых частей нет, считай ФИО пустым.

    2. **Сопоставление по ФИО.**
       - Если в ФИО есть два или более значащих слов, проверь, содержатся ли среди них одновременно имя и фамилия какого-либо кандидата (порядок слов в ФИО и у кандидата роли не играет). При полном совпадении (найдены и имя, и фамилия одного кандидата) уверенность 10/10 – сразу верни номер этого кандидата. Если таких кандидатов несколько (одинаковые ФИО), верни номер первого из них.
       - Если значимое слово одно, сравни его с именами и фамилиями всех кандидатов. Возможные ситуации:
         - Слово совпало с именем одного кандидата (и с фамилиями не совпадает) – зафиксируй «имя найдено» и переходи к шагу 3, используя найденное имя.
         - Слово совпало с фамилией одного кандидата (и с именами не совпадает) – зафиксируй «фамилия найдена» и переходи к шагу 3.
         - Слово совпало с именем одного кандидата и с фамилией другого – однозначного сопоставления нет, уверенность <7/10, верни 0.
         - Если слово не совпало ни с одним именем или фамилией – переходи к шагу 3, считая ФИО не давшим зацепок.

    3. **Анализ ника.**
       - Преобразуй ник из латиницы в вероятные русские варианты (транслитерация с латиницы на кириллицу). Используй стандартную обратную транслитерацию, учитывая типичные для Instagram сокращения:
         - `ov` → `ов`, `ev` → `ев`, `iy`/`y` на конце → `ий`/`ый`, `a` → `а`, `o` → `о`, `e` → `е` (или `э`), `zh` → `ж`, `sh` → `ш`, `ch` → `ч`, `ya` → `я`, `yu` → `ю`, `kh` → `х`, `ts` → `ц` и т.д.
         - Примеры: `ivanov` → `Иванов`, `oleg` → `Олег`, `smirnoff` → `Смирнов`, `anna.petrova` → `Анна Петрова` (разделитель `.` / `_` / `-` можно трактовать как пробел).
       - Полученную русскую строку (или набор слов, если были разделители) сравни с именами и фамилиями кандидатов.

       Далее действуй по ситуации (с учётом того, что ФИО могло дать зацепки на шаге 2):

       **А) Если из ФИО уже известно имя** (одно слово совпало с именем кандидата):
          - Среди кандидатов с таким же именем найди того, чья фамилия (полностью или начальная часть) содержится в транслитерированном нике. Например, имя `Олег` и ник `oleg.ivanov` → фамилия `Иванов` найдена.
          - Если такой кандидат ровно один, уверенность 9/10 – верни его номер.
          - Если подходящих кандидатов несколько (однофамильцы с разными именами не могут быть, т.к. мы уже отфильтровали по имени; остаются только дубли ФИО) – верни номер первого из них.
          - Если ник не содержит фамилии ни одного из кандидатов с этим именем, уверенность ниже 7/10 – верни 0.

       **Б) Если из ФИО известна только фамилия** (одно слово совпало с фамилией):
          - Проверь, содержит ли транслитерированный ник ещё и имя того кандидата, чья фамилия найдена.
          - Если имя кандидата обнаружено в нике (вместе с фамилией) и такой кандидат один – уверенность 9/10, верни его номер.
          - Если имя не найдено, но фамилия уникальна (встречается ровно у одного кандидата) – уверенность 8/10, верни номер.
          - Если фамилия есть у нескольких кандидатов **с разными именами** – уверенность ниже 7/10, верни 0.
          - Если фамилия есть у нескольких кандидатов **с одинаковыми ФИО** (дубли) – считай это одним кандидатом и верни номер первого.

       **В) Если ФИО полностью отсутствует или не дало зацепок:**
          - Ищи в транслитерированном нике одновременно имя и фамилию одного кандидата (в любом порядке, возможно с разделителями). При уникальном совпадении – уверенность 9/10, верни номер.
          - Если найдена только фамилия и она принадлежит ровно одному кандидату – уверенность 8/10, верни его номер.
          - Если найдена только фамилия, но она есть у нескольких кандидатов с разными именами – уверенность ниже 7/10, верни 0. Если же это дубли (одинаковые ФИО), верни номер первого.
          - Если найдено только имя, а кандидатов с таким именем больше одного – уверенность ниже 7/10, верни 0.

    4. **Финальная проверка уверенности.**
       - Возвращай номер кандидата, только если уверенность по описанным правилам не ниже 7 из 10.
       - Если ни один из шагов не дал достаточной уверенности, верни 0.
       - **Всегда, когда в списке есть кандидаты с полностью одинаковыми ФИО, при совпадении отдавай номер первого из них.**

    #Данные:
    Ник пользователя из Instagram: "{username}"
    ФИО пользователя из Instagram: "{full_name}"

    Список потенциальных кандидатов: {candidates}

    #Формат ответа:
    В ответе ты должен указать номер кандидата, которому принадлежит этот аккаунт только в том случае, если ты уверен, что этот аккаунт принадлежит этому кандидату минимум на 7/10. Если ты не уверен, отдай 0.
    Если ты нашел совпадение, но в списке потенциальных кандидатов есть еще такие же одинаковые ФИО, отдай номер первого из них.
    Ответь ТОЛЬКО одной цифрой, которая соответствует номеру кандидата, либо 0, если ник пользователя из Instagram и его ФИО не принадлежат ни одному кандидату.

# Sherlock REST API (Module 2: Telegram contact resolution).
#
# Step 5 of the daily pipeline POSTs each "naked" lead (no phone /
# telegram_username from bio) to Sherlock to try and resolve a Telegram
# contact. The API runs a real Telegram-bot client behind the scenes,
# so individual calls are slow (tens of seconds to minutes) -- it's
# always async: enqueue, then poll /v1/tasks/{id} until terminal.
#
# `concurrency.workers: null` (the default) means Step 5 will probe
# /v1/health at startup and use `pool.by_status.idle` as the worker
# count. That matches the practical concurrency cap (one task = one
# Telegram account); going higher just stuffs the server-side queue
# without making things faster. Override with an integer to force a
# specific count (or via `--workers N` on the pipeline CLI).
sherlock:
  base_url: "http://94.131.9.237:8000"
  api_key_env_var: "SHERLOCK_API_KEY"
  nick_search:
    # 1 page is enough to confirm a Telegram handle exists / doesn't.
    # We don't paginate further because Step 5 only needs a yes/no answer.
    max_pages: 1
    max_attempts: 3
  photo_search:
    # 20 pages ~= 135 s end-to-end on our smoke test (avg ~15 s/page).
    # Lower = faster + cheaper but you may miss matches on the tail.
    max_pages: 20
    max_attempts: 3
  task:
    poll_interval_secs: 3
    max_wait_secs: 600
  concurrency:
    workers: null

logging:
  level: "INFO"
  pipeline_log_dir: "logs"
